<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deansgate 联排出租对比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a surveyor's worksheet. Sticky result strip on top, controls left, evidence right. */
:root{
  --paper:#eef1f4; --card:#ffffff; --ink:#14213d; --muted:#5b6679; --line:#d5dbe3;
  --a:#17705f; --b:#c2570c; --c:#6b7689; --good:#1f8a5b; --bad:#c0392b; --accent:#14213d;
  --display:"Familjen Grotesk","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --body:"IBM Plex Sans","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0f1623; --card:#172033; --ink:#e8edf5; --muted:#9aa6bb; --line:#2a3550;
    --a:#3fc2a6; --b:#f0924f; --c:#93a0b8; --good:#46c88b; --bad:#ef7a6c; --accent:#e8edf5; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1623; --card:#172033; --ink:#e8edf5; --muted:#9aa6bb; --line:#2a3550;
  --a:#3fc2a6; --b:#f0924f; --c:#93a0b8; --good:#46c88b; --bad:#ef7a6c; --accent:#e8edf5; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--a)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* sticky strip */
.strip{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.strip .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:8px;padding-bottom:8px}
.mini{display:flex;flex-direction:column;border-left:4px solid var(--c);padding:2px 8px;min-width:0}
.mini small{color:var(--muted);font-size:11px;line-height:1.2}
.mini b{font-size:17px;line-height:1.25;white-space:nowrap}
.mini.a{border-color:var(--a)} .mini.b{border-color:var(--b)} .mini.c{border-color:var(--c)}

header.top{padding:22px 0 8px}
header.top .kicker{font:500 12px/1 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
header.top h1{font-size:clamp(26px,5.2vw,40px);line-height:1.1;margin:8px 0 10px;font-weight:700}
header.top p{margin:0;color:var(--muted);max-width:68ch}

.verdict{background:var(--ink);color:var(--paper);border-radius:10px;padding:16px 18px;margin:14px 0 16px}
:root[data-theme="dark"] .verdict{background:#223052;color:#e8edf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .verdict{background:#223052;color:#e8edf5}}
.verdict h2{font-size:clamp(18px,3.4vw,24px);line-height:1.25;font-weight:600}
.verdict p{margin:8px 0 0;opacity:.88;font-size:14px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:8px;padding:12px 14px;min-width:0}
.tile.a{border-top-color:var(--a)} .tile.b{border-top-color:var(--b)} .tile.c{border-top-color:var(--c)}
.tile h3{font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:500 11px/1 var(--mono);background:var(--good);color:#fff;padding:3px 6px;border-radius:99px}
.tile .big{font-size:clamp(22px,4vw,30px);font-weight:600;margin:6px 0 2px;line-height:1.1}
.tile .sub{color:var(--muted);font-size:12.5px;line-height:1.5}
.pos{color:var(--good)} .neg{color:var(--bad)}

.main{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start;padding-bottom:30px}
@media (min-width:960px){.main{grid-template-columns:350px minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.controls{display:flex;flex-direction:column;gap:18px}
@media (min-width:960px){.controls{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto}}
.group h3{font-size:12px;font:600 12px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.field{margin-bottom:12px}
.field .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13.5px}
.field .row output{font:500 14px var(--mono);white-space:nowrap}
.hint{color:var(--muted);font-size:12px;margin-top:2px}
input[type=range]{width:100%;accent-color:var(--a);margin:6px 0 0;height:28px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:500 13px var(--body);background:transparent;color:var(--ink);border:0;padding:9px 6px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.radios input{margin-top:3px;accent-color:var(--a)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
details.adv summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.advgrid{display:grid;grid-template-columns:1fr 104px;gap:8px 10px;align-items:center;margin-top:10px;font-size:13px}
.advgrid input{width:100%;font:500 13px var(--mono);padding:6px 7px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);text-align:right}
.advgrid .sec{grid-column:1/-1;font:600 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
.btn{font:500 13px var(--body);padding:8px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer}
.btn:hover{background:var(--paper)}

.results{display:flex;flex-direction:column;gap:18px;min-width:0}
.results h2{font-size:19px;margin-bottom:4px}
.results .lead{color:var(--muted);margin:0 0 12px;font-size:13.5px}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chartbox .lab{font-weight:600;font-size:11.5px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font:600 12px var(--mono);color:var(--muted)}
tr.tot td{font-weight:600;background:var(--paper)}
.heat td,.heat th{padding:0;border:1px solid var(--card)}
.heat th{padding:6px 8px;font:500 12px var(--mono);color:var(--muted);background:transparent}
.heat button{display:block;width:100%;min-width:52px;padding:9px 4px;font:500 12px var(--mono);border:0;background:transparent;color:var(--ink);cursor:pointer}
.heat button.cur{outline:3px solid var(--ink);outline-offset:-3px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.be{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.be div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.be b{display:block;font-size:22px}
.be span{font-size:12.5px;color:var(--muted)}
.qual td{white-space:normal;text-align:left;vertical-align:top;font-size:13px;min-width:150px}
.qual th{text-align:left}
.risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.risk{border:1px solid var(--line);border-left:4px solid var(--b);border-radius:6px;padding:10px 12px;font-size:13px}
.risk b{display:block;margin-bottom:3px}
.src{font-size:12.5px;color:var(--muted);columns:1}
@media (min-width:760px){.src{columns:2;column-gap:28px}}
.src li{margin-bottom:6px;break-inside:avoid}
footer{padding:6px 0 40px;color:var(--muted);font-size:12.5px}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr}
  .be{grid-template-columns:1fr}
  .mini b{font-size:14.5px}
}
@media (prefers-reduced-motion:no-preference){.tile .big,.mini b{transition:color .2s}}

.langbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lang{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.lang button{font:500 13px var(--body);background:transparent;color:var(--ink);border:0;padding:7px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.window{display:inline-block;margin-top:10px;font:500 12px var(--mono);border:1px dashed var(--muted);color:var(--ink);padding:4px 8px;border-radius:5px}

[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin:14px 0 4px;border-bottom:1px solid var(--line)}
.tabs button{font:600 14px var(--display);background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--a)}
.notes{margin:10px 0 0;padding-left:18px;font-size:13.5px}
.notes li{margin-bottom:7px}
.warnbox{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:6px;padding:10px 12px;font-size:13px;margin-top:12px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;margin-bottom:8px}
.chk input{margin-top:3px;accent-color:var(--a)}
</style>
</head>
<body>

<div class="strip" aria-label="Summary">
  <div class="wrap">
    <div class="mini a"><small id="stripLA">–</small><b class="num" id="sA">–</b></div>
    <div class="mini b"><small id="stripLB">–</small><b class="num" id="sB">–</b></div>
    <div class="mini c"><small id="stripLC">–</small><b class="num" id="sC">–</b></div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div class="langbar">
      <div class="kicker" data-i18n="kicker">–</div>
      <div class="lang" id="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>
    <h1 data-i18n="h1">–</h1>
    <p data-i18n="intro">–</p>
    <span class="window" data-i18n="window">–</span>
  </header>
  <nav class="tabs" id="tabs" aria-label="Views">
    <button type="button" data-tab="let" data-i18n="tabLet">–</button>
    <button type="button" data-tab="own" data-i18n="tabOwn">–</button>
  </nav>

  <div id="viewLet">
  <section class="verdict" aria-live="polite">
    <h2 id="vHead">–</h2>
    <p id="vSub">–</p>
  </section>

  <section class="tiles" id="tiles"></section>

  <div class="main">
    <aside class="panel controls">
      <div class="group">
        <h3 data-i18n="gMarket">–</h3>
        <div class="field">
          <div class="seg" id="caseSeg" role="group">
            <button type="button" data-case="cons" data-i18n="cons">–</button>
            <button type="button" data-case="base" data-i18n="base">–</button>
            <button type="button" data-case="opt" data-i18n="opt">–</button>
          </div>
          <div class="hint" data-i18n="caseHint">–</div>
        </div>
        <div class="field">
          <div class="row"><label for="occ" data-i18n="lOcc">–</label><output id="occ_o" for="occ"></output></div>
          <input type="range" id="occ" min="30" max="85" step="1">
          <div class="hint" data-i18n="hOcc">–</div>
        </div>
        <div class="field">
          <div class="row"><label for="adr" data-i18n="lAdr">–</label><output id="adr_o" for="adr"></output></div>
          <input type="range" id="adr" min="100" max="320" step="5">
          <div class="hint" data-i18n="hAdr">–</div>
        </div>
        <div class="field">
          <div class="row"><label for="bMgmt" data-i18n="lMgmt">–</label><output id="bMgmt_o" for="bMgmt"></output></div>
          <input type="range" id="bMgmt" min="0" max="30" step="1">
        </div>
      </div>

      <div class="group">
        <h3 data-i18n="gA">–</h3>
        <div class="field">
          <div class="row"><label for="aRent" data-i18n="lRent">–</label><output id="aRent_o" for="aRent"></output></div>
          <input type="range" id="aRent" min="1200" max="1800" step="25">
          <div class="hint" data-i18n="hRent">–</div>
        </div>
        <div class="field">
          <div class="row"><label for="aVoid" data-i18n="lVoid">–</label><output id="aVoid_o" for="aVoid"></output></div>
          <input type="range" id="aVoid" min="0" max="6" step="1">
        </div>
      </div>

      <div class="group">
        <h3 data-i18n="gTax">–</h3>
        <div class="field">
          <div class="seg" id="taxSeg" role="group">
            <button type="button" data-tax="basic" data-i18n="taxBasic">–</button>
            <button type="button" data-tax="high" data-i18n="taxHigh">–</button>
          </div>
          <div class="hint" id="taxHint"></div>
        </div>
        <div class="field">
          <div class="hint" style="margin:0 0 6px;color:var(--ink);font-size:13px" data-i18n="ctTitle">–</div>
          <div class="radios" id="ctRadios">
            <label><input type="radio" name="ct" value="2"><span data-i18n="ct2">–</span></label>
            <label><input type="radio" name="ct" value="1"><span data-i18n="ct1">–</span></label>
            <label><input type="radio" name="ct" value="0"><span data-i18n="ct0">–</span></label>
          </div>
        </div>
        <div class="field">
          <label class="radios" style="flex-direction:row;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer"><input type="checkbox" id="listed" style="margin-top:3px;accent-color:var(--a)"><span data-i18n="listed">–</span></label>
        </div>
      </div>

      <details class="adv">
        <summary data-i18n="more">–</summary>
        <div class="advgrid" id="adv"></div>
      </details>
      <button class="btn" type="button" id="reset" data-i18n="reset">–</button>
    </aside>

    <div class="results">
      <section class="panel chartbox">
        <h2 data-i18n="hChart">–</h2>
        <p class="lead" data-i18n="leadChart">–</p>
        <div id="chart"></div>
      </section>
      <section class="panel">
        <h2 data-i18n="hDetail">–</h2>
        <p class="lead" data-i18n="leadDetail">–</p>
        <div class="scroll"><table id="detail"></table></div>
      </section>
      <section class="panel">
        <h2 data-i18n="hBE">–</h2>
        <p class="lead" data-i18n="leadBE">–</p>
        <div class="be">
          <div><b class="num" id="beOcc">–</b><span id="beOccS">–</span></div>
          <div><b class="num" id="beAdr">–</b><span id="beAdrS">–</span></div>
        </div>
      </section>
      <section class="panel">
        <h2 data-i18n="hHeat">–</h2>
        <p class="lead" data-i18n="leadHeat">–</p>
        <div class="scroll"><table class="heat" id="heat"></table></div>
        <div class="legend"><span><i class="sw" style="background:color-mix(in srgb,var(--good) 45%,transparent)"></i><span data-i18n="lgB">–</span></span><span><i class="sw" style="background:color-mix(in srgb,var(--bad) 45%,transparent)"></i><span data-i18n="lgA">–</span></span><span data-i18n="lgCur">–</span></div>
      </section>
      <section class="panel">
        <h2 data-i18n="hQual">–</h2>
        <div class="scroll"><table class="qual" id="qual"></table></div>
      </section>
      <section class="panel">
        <h2 data-i18n="hRisk">–</h2>
        <div class="risks" id="risks" style="margin-top:10px"></div>
      </section>
      <section class="panel">
        <h2 data-i18n="hSrc">–</h2>
        <ul class="src" id="src" style="margin-top:10px;padding-left:18px"></ul>
      </section>
    </div>
  </div>
  </div>

  <div id="viewOwn" hidden>
    <section class="verdict" aria-live="polite">
      <h2 id="oHead">–</h2>
      <p id="oSub">–</p>
    </section>
    <section class="tiles" id="oTiles"></section>
    <div class="main">
      <aside class="panel controls">
        <div class="group">
          <h3 data-i18n="oG1">–</h3>
          <div class="field"><div class="row"><label for="oV" data-i18n="oLV">–</label><output id="oV_o" for="oV"></output></div><input type="range" id="oV" min="250000" max="1200000" step="10000"><div class="hint" data-i18n="oHV">–</div></div>
          <div class="field"><div class="row"><label for="oCb" data-i18n="oLCb">–</label><output id="oCb_o" for="oCb"></output></div><input type="range" id="oCb" min="100000" max="1000000" step="10000"><div class="hint" data-i18n="oHCb">–</div></div>
          <div class="field"><div class="row"><label for="oG" data-i18n="oLG">–</label><output id="oG_o" for="oG"></output></div><input type="range" id="oG" min="0" max="6" step="0.5"></div>
          <div class="field"><div class="row"><label for="oN" data-i18n="oLN">–</label><output id="oN_o" for="oN"></output></div><input type="range" id="oN" min="0" max="20" step="1"><div class="hint" data-i18n="oHN">–</div></div>
        </div>
        <div class="group">
          <h3 data-i18n="oG2">–</h3>
          <div class="field"><div class="row"><label for="oRate" data-i18n="oLRate">–</label><output id="oRate_o" for="oRate"></output></div><input type="range" id="oRate" min="20" max="45" step="5"></div>
          <label class="chk"><input type="checkbox" id="oPlus2"><span data-i18n="oPlus2">–</span></label>
        </div>
        <div class="group">
          <h3 data-i18n="oG3">–</h3>
          <div class="field"><div class="seg" id="oModeSeg" role="group"><button type="button" data-mode="div" data-i18n="oModeDiv">–</button><button type="button" data-mode="loan" data-i18n="oModeLoan">–</button></div><div class="hint" data-i18n="oHMode">–</div></div>
          <label class="chk"><input type="checkbox" id="oSdltRel"><span data-i18n="oSdltRel">–</span></label>
          <label class="chk"><input type="checkbox" id="oS162"><span data-i18n="oS162">–</span></label>
          <div class="field"><div class="row"><label for="oComp" data-i18n="oLComp">–</label><output id="oComp_o" for="oComp"></output></div><input type="range" id="oComp" min="0" max="4000" step="100"><div class="hint" data-i18n="oHComp">–</div></div>
          <div class="field"><div class="row"><label for="oPrem" data-i18n="oLPrem">–</label><output id="oPrem_o" for="oPrem"></output></div><input type="range" id="oPrem" min="0" max="1" step="0.05"><div class="hint" data-i18n="oHPrem">–</div></div>
        </div>
        <details class="adv"><summary data-i18n="more">–</summary><div class="advgrid" id="oAdv"></div></details>
        <button class="btn" type="button" id="oReset" data-i18n="reset">–</button>
      </aside>
      <div class="results">
        <section class="panel"><h2 data-i18n="oHUp">–</h2><p class="lead" data-i18n="oLeadUp">–</p><div class="scroll"><table id="oUp"></table></div></section>
        <section class="panel"><h2 data-i18n="oHAnn">–</h2><p class="lead" id="oLeadAnn">–</p><div class="scroll"><table id="oAnn"></table></div></section>
        <section class="panel chartbox"><h2 data-i18n="oHChart">–</h2><p class="lead" data-i18n="oLeadChart">–</p><div id="oChart"></div></section>
        <section class="panel"><h2 data-i18n="oHNotes">–</h2><ul class="notes" id="oNotes"></ul></section>
        <section class="panel"><h2 data-i18n="oHSrc">–</h2><ul class="src" id="oSrc" style="margin-top:10px;padding-left:18px"></ul></section>
      </div>
    </div>
  </div>
  <footer data-i18n="foot">–</footer>
</div>
<script>
(function(){
  var DAYS=[31,31,28,31,30,31,30,31,31], SEAS=[.95,.8,.85,.95,1,1.1,1.1,1.15,1.15], RAMP=[.5,.8,.9,1,1,1,1,1,1];

    var intP=M*rate, intC=M*(rate+O.prem/100);
    var annP=(op-intP)-(op*tp-0.2*intP);
    var profC=op-intC-O.comp, ctC=ctax(profC), retC=profC-ctC;
    var E=O.V-M;
    var cgtNow=O.s162?0:Math.max(0,O.V-O.Cb-O.owners*O.aea)*cg;
    var sdlt=sdltCo(O.V,O.sdltRel);
    var fees={legal:O.legal,val:O.val,acct:O.acct,remort:O.remort,form:O.form};
    var feeSum=O.legal+O.val+O.acct+O.remort+O.form;
    var dead=sdlt+feeSum, U=cgtNow+dead;
    function series(mode){
      var L0=mode==='loan'?(O.s162?Math.max(0,Math.min(E,O.Cb-M)):E):0;
      var shareBase=Math.max(0,E-L0-(O.s162?(O.V-O.Cb):0));
      var out=[], Lbal=L0, ext=0;
      for(var n=0;n<=40;n++){
        if(n>0){ var repay=Math.min(retC,Lbal); Lbal-=repay; ext+=repay+(retC-repay)*(1-dv); }
        var SN=O.V*Math.pow(1+O.G/100,n);
        var netP=n*annP+(SN-M)-Math.max(0,SN-O.Cb-O.owners*O.aea)*cg;
        var gain=n>0?Math.max(0,SN-O.V):0;
        var ctGain=ctax(profC+gain)-ctax(profC);
        var proceeds=SN-M-ctGain;
        var rep=Math.min(proceeds,Lbal), rest=proceeds-rep;
        var liq=Math.max(0,rest-shareBase)*cg;
        var netC=-U+ext+rep+rest-liq;
        out.push(netC-netP);
      }
      return out;
    }
    var sd=series('div'), sl=series('loan');
    var be=function(a){for(var n=1;n<=40;n++){if(a[n]>=0)return n}return null};
    return {op:op,annP:annP,intP:intP,intC:intC,profC:profC,ctC:ctC,retC:retC,dv:dv,cgtNow:cgtNow,sdlt:sdlt,fees:fees,feeSum:feeSum,dead:dead,U:U,sd:sd,sl:sl,beD:be(sd),beL:be(sl),tp:tp};
  }
  function renderOwn(){
    var t=T(), c=ownCalc(), sel=O.mode==='loan'?c.sl:c.sd, beSel=O.mode==='loan'?c.beL:c.beD, gapN=sel[O.N];

    if(TAB==='own'){ $('sA').textContent=gbp(c.U); $('sA').className='num neg'; $('sB').textContent=gbp(O.mode==='loan'?annLoan:annDiv,true); $('sB').className='num '+((O.mode==='loan'?annLoan:annDiv)<0?'neg':'pos'); $('sC').textContent=gbp(gapN,true); $('sC').className='num '+(gapN<0?'neg':'pos'); }
    // tiles
    $('oTiles').innerHTML=
      '<article class="tile c"><h3>'+t.oTileUp+'</h3><div class="big num neg">'+gbp(-c.U)+'</div><div class="sub">'+t.oTileUpSub(c.cgtNow,c.dead)+'</div></article>'+
      '<article class="tile b"><h3>'+t.oTileAnn+'</h3><div class="big num '+((O.mode==='loan'?annLoan:annDiv)<0?'neg':'pos')+'">'+gbp(O.mode==='loan'?annLoan:annDiv,true)+'</div><div class="sub">'+t.oTileAnnSub(annDiv,annLoan)+'</div></article>'+
      '<article class="tile a"><h3>'+t.oTileN(O.N)+'</h3><div class="big num '+(gapN<0?'neg':'pos')+'">'+gbp(gapN,true)+'</div><div class="sub">'+t.oTileNSub(beSel)+'</div></article>';
    // upfront table
    var vals=[c.cgtNow,c.sdlt,c.fees.legal,c.fees.val,c.fees.acct,c.fees.remort,c.fees.form];
    var h='<tbody>'; vals.forEach(function(v,i){h+='<tr><td>'+t.oUpRows[i]+'</td><td class="num">'+gbp(v)+'</td></tr>'});
    h+='<tr class="tot"><td>'+t.oUpTotal+'</td><td class="num">'+gbp(c.U)+'</td></tr><tr><td>'+t.oUpDead+'</td><td class="num neg">'+gbp(c.dead)+'</td></tr></tbody>';
    $('oUp').innerHTML=h;
    // annual table
    var persTax=c.op*c.tp-0.2*c.intP, divTax=c.retC*c.dv;
    var rows=[
      [c.op,c.op,c.op],
      [-c.intP,-c.intC,-c.intC],
      [0,-O.comp,-O.comp],
      [-persTax,-c.ctC,-c.ctC],
      [null,c.retC,c.retC],
      [null,-divTax,0],
      [c.annP,c.retC-divTax,c.retC]];
    var a='<thead><tr><th></th>'+t.oAnnHead.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>';
    rows.forEach(function(r,i){var tot=i===6;a+='<tr'+(tot?' class="tot"':'')+'><td>'+t.oAnnRows[i]+'</td>'+r.map(function(v){return '<td class="num">'+(v===null?'–':gbp(v))+'</td>'}).join('')+'</tr>'});
    $('oAnn').innerHTML=a+'</tbody>';
    $('oLeadAnn').textContent=t.oLeadAnn(c.op);
    // chart
    var W=640,H=290,L=62,Rr=96,Tp=14,Bt=34,pw=W-L-Rr,ph=H-Tp-Bt, NM=20;
    var ser=[[c.sd,'var(--b)',t.oLnDiv],[c.sl,'var(--a)',t.oLnLoan]];
    var lo=0,hi=0; ser.forEach(function(s){for(var i=0;i<=NM;i++){lo=Math.min(lo,s[0][i]);hi=Math.max(hi,s[0][i])}});
    var span=Math.max(hi-lo,10000), step=Math.pow(10,Math.floor(Math.log10(span/4)));
    [1,2,2.5,5,10].some(function(m){if(span/(step*m)<=5){step=step*m;return true}});
    lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step; if(hi===lo)hi=lo+step;
    var X=function(i){return L+pw*i/NM}, Y=function(v){return Tp+ph*(1-(v-lo)/(hi-lo))};
    var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+t.oChartAria+'">';
    for(var v=lo;v<=hi+1e-6;v+=step){g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="'+(Math.abs(v)<1e-6?1.6:1)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+(v<0?'−':'')+'£'+(Math.abs(v)>=1000?Math.round(Math.abs(v)/100)/10+'k':Math.abs(v))+'</text>'}
    for(var i=0;i<=NM;i+=5){g+='<text x="'+X(i)+'" y="'+(H-12)+'" text-anchor="middle">'+i+'</text>'}
    g+='<text x="'+(L+pw/2)+'" y="'+(H-0)+'" text-anchor="middle">'+t.oChartAxis+'</text>';
    var labs=[];
    ser.forEach(function(s){
      var pts=[];for(var i=0;i<=NM;i++)pts.push(X(i)+','+Y(s[0][i]));
      g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+s[1]+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+X(O.N)+'" cy="'+Y(s[0][O.N])+'" r="4.5" fill="'+s[1]+'"/>';
      labs.push({y:Y(s[0][NM]),c:s[1],t:s[2]+' '+k(s[0][NM])});
    });
    g+='<line x1="'+X(O.N)+'" x2="'+X(O.N)+'" y1="'+Tp+'" y2="'+(Tp+ph)+'" stroke="var(--muted)" stroke-dasharray="3 4"/>';
    labs.sort(function(a,b){return a.y-b.y}); if(labs[1].y-labs[0].y<15)labs[1].y=labs[0].y+15;
    labs.forEach(function(l){g+='<text class="lab" x="'+(W-Rr+10)+'" y="'+(l.y+4)+'" style="fill:'+l.c+'">'+l.t+'</text>'});
    $('oChart').innerHTML=g+'</svg>';
  }
  var OFMT={oV:function(v){return gbp(v)},oCb:function(v){return gbp(v)},oG:function(v){return v+'%'},oN:function(v){var z=LANG==='zh';return z?v+' 年':v+(v===1?' year':' years')},oRate:function(v){return v+'%'},oComp:function(v){return gbp(v)+(LANG==='zh'?'/年':'/yr')},oPrem:function(v){return '+'+Number(v).toFixed(2)+'%'}};
  var OKEY={oV:'V',oCb:'Cb',oG:'G',oN:'N',oRate:'rate',oComp:'comp',oPrem:'prem'};
  function syncOwn(){
    Object.keys(OKEY).forEach(function(id){$(id).value=O[OKEY[id]];$(id+'_o').textContent=OFMT[id](O[OKEY[id]])});
    $('oPlus2').checked=O.plus2; $('oSdltRel').checked=O.sdltRel; $('oS162').checked=O.s162;
    setPressed('#oModeSeg button','mode',O.mode);
    T().oAdv.forEach(function(a){if(a[0]!=='sec'&&$('oadv_'+a[0]))$('oadv_'+a[0]).value=O[a[0]]});
  }
  function buildOwnAdv(){
    var h='';
    T().oAdv.forEach(function(a){
      if(a[0]==='sec')h+='<div class="sec">'+a[1]+'</div>';
      else h+='<label for="oadv_'+a[0]+'">'+a[1]+'</label><input type="number" inputmode="decimal" id="oadv_'+a[0]+'" step="'+a[2]+'">';
    });
    $('oAdv').innerHTML=h;
    T().oAdv.forEach(function(a){if(a[0]==='sec')return;$('oadv_'+a[0]).addEventListener('input',function(e){var v=parseFloat(e.target.value);if(!isNaN(v)){O[a[0]]=v;renderOwn()}})});
  }
  function setTab(tab){
    TAB=tab;
    $('viewLet').hidden=tab!=='let'; $('viewOwn').hidden=tab!=='own';
    setPressed('#tabs button','tab',tab);
    var s=T().stripSets[tab]; $('stripLA').textContent=s[0];$('stripLB').textContent=s[1];$('stripLC').textContent=s[2];
    if(tab==='own')renderOwn(); else render();
    try{history.replaceState(null,'',tab==='own'?'#ownership':'#let')}catch(e){}
  }

  var fmt={occ:function(v){return v+'%'},adr:function(v){return '£'+v},bMgmt:function(v){return v+'%'},aRent:function(v){return '£'+Number(v).toLocaleString('en-GB')},aVoid:function(v){return T().voidFmt(v)}};
  function setPressed(sel,attr,val){document.querySelectorAll(sel).forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset[attr]===val))})}
  function sync(){
    ['occ','adr','bMgmt','aRent','aVoid'].forEach(function(id){$(id).value=S[id];$(id+'_o').textContent=fmt[id](S[id])});
    setPressed('#caseSeg button','case',S.caseSel); setPressed('#taxSeg button','tax',S.taxMode); setPressed('#lang button','lang',LANG);

  }

      if(a[0]==='sec') h+='<div class="sec">'+a[1][i]+'</div>';

    ADV.forEach(function(a){if(a[0]==='sec')return;$('adv_'+a[0]).addEventListener('input',function(e){var v=parseFloat(e.target.value);if(!isNaN(v)){S[a[0]]=v;render()}})});
  }
  function applyLang(){
    var t=T(), i=LANG==='zh'?0:1;

    var q='<thead><tr>'+t.qualH.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+
      t.qual.map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>'}).join('')+'</tbody>';

  function setLang(l){LANG=l;try{localStorage.setItem('dg-lang',l)}catch(e){}applyLang()}
  ['occ','adr','bMgmt','aRent','aVoid'].forEach(function(id){
    $(id).addEventListener('input',function(e){S[id]=Number(e.target.value);if(id==='occ'||id==='adr')S.caseSel='custom';$(id+'_o').textContent=fmt[id](S[id]);setPressed('#caseSeg button','case',S.caseSel);render()});

})();
